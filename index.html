@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090a; --surface:#131517; --ink:#eef0f2; --muted:#9aa2aa; --line:#272b2f; --soft:#1b1e21;
  --band:#000000; --band-ink:#f4f5f6; --band-muted:#8d949b;
  --red:#ff4b5e; --red-ink:#140306; --red-soft:#3a1219; --yellow:#f3c84a; --good:#4cc47e; --good-soft:#12301f;
  --heat1:#2c1217; --heat2:#5c1a25; --heat3:#a82638;
  --crest-filter:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090a; --surface:#131517; --ink:#eef0f2; --muted:#9aa2aa; --line:#272b2f; --soft:#1b1e21;
  --band:#000000; --band-ink:#f4f5f6; --band-muted:#8d949b;
  --red:#ff4b5e; --red-ink:#140306; --red-soft:#3a1219; --yellow:#f3c84a; --good:#4cc47e; --good-soft:#12301f;
  --heat1:#2c1217; --heat2:#5c1a25; --heat3:#a82638;
  --crest-filter:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Band */
.band{background:var(--band);color:var(--band-ink);padding-inline:16px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,var(--band-ink) 0 28px,var(--band) 28px 56px);opacity:.9}
.band-in{max-width:1180px;margin:0 auto;padding-block:22px 28px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.crest{width:104px;height:104px;background:var(--crest) center/contain no-repeat;flex:none}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.band h1{margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,76px);line-height:.88;letter-spacing:.01em;text-transform:uppercase}
.band h1 span{color:var(--red)}
.status{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid #3a3f44;color:var(--band-muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-admin{border-color:var(--red);color:#fff;background:#c8102e}
.chip-btn{background:none;cursor:pointer;font-family:inherit}
.chip-btn:hover{border-color:var(--band-ink);color:var(--band-ink)}
/* Login sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.login{width:min(400px,100%);background:var(--surface);border-radius:12px;padding:22px;display:grid;gap:14px;border-top:6px solid var(--red)}
.login h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.login p{margin:0;color:var(--muted);font-size:14px}
.login input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:16px;width:100%}
.login .msg{color:var(--red);font-weight:600;font-size:14px}
.login .msg.ok{color:var(--good)}
/* Name picker */
.picker{display:grid;gap:10px}
.picker-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker-top input{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:40px}
.names{display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow-y:auto;padding:2px}
.names .pchip{padding:7px 12px}
.names .pchip b{font-weight:700}
.names .pchip span{font-weight:400}
.qa-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.pot{text-align:right;display:grid;gap:2px;justify-items:end}
.pot-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.pot-num{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,7vw,72px);line-height:.9}
.pot-sub{font-size:13px;color:var(--band-muted)}
@media (max-width:720px){
  .band-in{grid-template-columns:auto 1fr;gap:14px}
  .crest{width:72px;height:72px}
  .pot{grid-column:1/-1;justify-items:start;text-align:left;border-top:1px solid #2a2e33;padding-top:12px;grid-template-columns:auto 1fr;align-items:end;column-gap:14px}
  .pot-label{grid-column:1/-1}
}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;padding:14px 14px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab:hover{color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 120px;display:grid;gap:20px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn-red:hover{filter:brightness(1.07);border-color:var(--red)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-xl{border-color:var(--ink)}
.xl-ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:#1d6f42;color:#fff;font-family:var(--f-display);font-weight:900;font-size:13px}
.iconbtn{appearance:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:default}

/* Week bar */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wsel{position:relative;display:flex;align-items:baseline;gap:10px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px;cursor:pointer}

  (loginMsg?'<p class="msg" role="alert">'+esc(loginMsg)+'</p>':"")+
  '<div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="closelogin">Cancel</button>'+(first?"":'<button class="btn btn-red" type="submit">Unlock</button>')+'</div></form></div>'}
function doLogin(){var el=document.getElementById("login-pw");if(!el||!state.auth)return;
  if(Date.now()<lockUntil){loginMsg="Too many wrong tries. Wait "+Math.ceil((lockUntil-Date.now())/1000)+" seconds.";render();return}
  sha256(state.auth.salt+":"+el.value).then(function(h){
    if(h!==state.auth.hash){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}loginMsg="That password isn't right.";render();var x=document.getElementById("login-pw");if(x)x.focus();return}
    fails=0;loginMsg="Password correct. Connecting…";render();
    whenConnected().then(function(){
      if(!artifactApi&&!isEditor){loginMsg="Password correct, but this copy of the page can't save. You're probably on the public share link. Open the Fines Book from the Claude app or claude.ai while signed in to the owner's account, then log in there.";render();return}
      unlocked=true;loginOpen=false;loginMsg="";try{sessionStorage.setItem("awfc-key",state.auth.hash)}catch(x){}render();toast("Admin mode on.")})})}
function setPassword(){var a=document.getElementById("pw-new"),b=document.getElementById("pw-again");if(!a||!b)return;
  if(a.value.length<6){toast("Use at least 6 characters.");return}
  if(a.value!==b.value){toast("The two passwords don't match.");return}
  var salt=Math.random().toString(36).slice(2,12);
  sha256(salt+":"+a.value).then(function(h){state.auth={salt:salt,hash:h};unlocked=true;try{sessionStorage.setItem("awfc-key",h)}catch(x){}render();markDirty();toast("Password set. Press Save for everyone to make it live.")})}
function whenConnected(){return new Promise(function(res){var n=0;(function wait(){if(connReady)connReady.then(res,res);else if(++n>40)res();else setTimeout(wait,250)})()})}

  function(e){exporting=false;render();var c=e&&e.code;

/* ---------- save bar ---------- */
function renderSaveBar(){var el=document.getElementById("savebar");if(!el)return;
  if(!editable()||!dirty){el.innerHTML="";return}
  el.innerHTML='<div class="savebar"><div class="savebar-in"><span>'+(saveBlocked?'<b>Not saved.</b> '+esc(saveBlocked)+' Your changes are still here.':'Unsaved changes. Players won\'t see them until you save.')+'</span><div class="row"><button class="btn btn-ghost" data-act="discard" '+(saving?"disabled":"")+'>Discard</button><button class="btn btn-red" data-act="save" '+(saving?"disabled":"")+'>'+(saving?"Saving…":"Save for everyone")+'</button></div></div></div>'}
function markDirty(){dirty=JSON.stringify(state)!==savedStr;renderSaveBar()}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function buildDoc(){var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var css=document.getElementById("css").textContent,js=document.getElementById("appjs").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Alconbury Weald Fines Book</title>\n'+FONTS+'\n<style id="css">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="data">'+json+'</'+'script>\n<script id="appjs">'+js+'</'+'script>\n</body></html>'}
function save(){if(!artifactApi){toast("Saving isn't available in this view.");return}
  saving=true;renderSaveBar();saveUi();
  artifactApi.publish(buildDoc()).then(function(){saved=clone(state);savedStr=JSON.stringify(saved);dirty=false;saving=false;renderSaveBar();toast("Saved. Everyone now sees the update.")},
  function(e){saving=false;var c=e&&e.code;
    if(c==="conflict")toast("Someone else saved first. Loading their version.");
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){saveBlocked=c==="not_writer"?"This Claude account doesn't have edit access to the Fines Book. The owner can give it from the Share menu.":"Saving isn't available on this copy of the page. Open the Fines Book from the Claude app or claude.ai while signed in to the owner's account.";renderSaveBar()}

/* ---------- demo ---------- */
function makeDemo(){var s=clone(state),seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
  var names=["Player A","Player B","Player C","Player D","Player E","Player F","Player G","Player H","Player I","Player J","Player K","Player L","Player M","Player N"];
  s.players=names.map(function(n,i){return {id:"x"+i,name:n,num:String(i+1),active:true}});s.weeks={};
  var odds={db:.07,kit:.05,glv:.03,pen:.015,og:.01,arg:.05,late:.08,nts:.02,stu:.07,chat:.02,drink:.05,motm:.015,capt:.04};
  var prev=state;state=s;var ws=weeks();state=prev;var now=nowKey();
  ws.forEach(function(w,wi){var W={c:{},paid:{},prices:{},note:""};s.tariff.forEach(function(t){W.prices[t.id]=t.amount});
    s.players.forEach(function(p,pi){var bias=pi===2?2.2:pi===7?1.7:pi===11?.3:1;s.tariff.forEach(function(t){if(rnd()<(odds[t.id]||.03)*bias){(W.c[p.id]=W.c[p.id]||{})[t.id]=(t.id==="kit"&&rnd()<.3)?2:1}});
      if(W.c[p.id]&&w.key<now&&rnd()<(wi<ws.length-3?.85:.4))W.paid[p.id]=true});
    if(Object.keys(W.c).length)s.weeks[w.key]=W});
  return s}

app.addEventListener("click",function(e){var b=e.target.closest("[data-tab],[data-dash],[data-act]");if(!b)return;
  if(b.dataset.tab){ui.tab=b.dataset.tab;showCopy=false;saveUi();render();window.scrollTo(0,0);return}
  if(b.dataset.dash){ui.dash=b.dataset.dash;saveUi();render();return}
  var a=b.dataset.act,ws=weeks(),i=ws.findIndex(function(w){return w.key===ui.week});
  if(a==="wprev"&&i>0){ui.week=ws[i-1].key;showCopy=false;saveUi();render()}
  else if(a==="wnext"&&i<ws.length-1){ui.week=ws[i+1].key;showCopy=false;saveUi();render()}
  else if(a==="paid"){var w=ensureWeek(ui.week),p=b.dataset.p;if(w.paid[p])delete w.paid[p];else w.paid[p]=true;patchTotals();markDirty()}
  else if(a==="player"){ui.player=b.dataset.p;ui.tab="dash";ui.dash="player";saveUi();render();if(e.target.closest(".tabs")==null)window.scrollTo(0,0)}
  else if(a==="demo"){real=state;state=makeDemo();demo=true;render()}
  else if(a==="exitdemo"){state=real;real=null;demo=false;render()}
  else if(a==="goclub"){ui.tab="club";saveUi();render();var n=document.getElementById("np-name");if(n)n.focus()}
  else if(a==="copy"){var txt=summaryText(ws);var done=function(){toast("Copied. Paste it into the team chat.")};
    try{navigator.clipboard.writeText(txt).then(done,function(){showCopy=true;render()})}catch(x){showCopy=true;render()}}
  else if(a==="save")save();
  else if(a==="excel")exportExcel();
  else if(a==="pick"){var id=b.dataset.p;pick[id]=!pick[id];b.setAttribute("aria-pressed",String(!!pick[id]));updatePick()}
  else if(a==="pickclear"){pick={};document.querySelectorAll('#qa-names .pchip').forEach(function(c){c.setAttribute("aria-pressed","false")});updatePick()}
  else if(a==="login"){if(demo)return;loginOpen=true;loginMsg="";render();var li=document.getElementById("login-pw");if(li)li.focus()}
  else if(a==="gopw"){ui.tab="club";saveUi();render();var pw=document.getElementById("pw-new");if(pw){if(pw.scrollIntoView)pw.scrollIntoView({block:"center"});pw.focus()}}
  else if(a==="closelogin"){loginOpen=false;render()}
  else if(a==="lock"){if(dirty){toast("Save or discard your changes before locking.");return}unlocked=false;try{sessionStorage.removeItem("awfc-key")}catch(x){}render();toast("Locked. Admin login needed to make changes.")}
  else if(a==="clearpw"){delete state.auth;render();markDirty()}
  else if(a==="discard"){state=clone(saved);dirty=false;render()}
  else if(a==="retire"){var t=T[b.dataset.t];if(t){if(t.retired)delete t.retired;else t.retired=true;render();markDirty()}}
  else if(a==="addfine"){state.tariff.push({id:uid("f"),name:"New fine",short:"New fine",amount:2,cat:"Other"});render();markDirty()}
  else if(a==="pstatus"){var pl=player(b.dataset.p);if(!pl)return;if(!hasFines(pl.id)){state.players=state.players.filter(function(x){return x.id!==pl.id})}else if(pl.active===false)delete pl.active;else pl.active=false;render();markDirty()}
